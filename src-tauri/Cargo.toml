[package]
name = "cutcat"
version = "0.2.0"
description = "A lightweight, precise video cutter"
authors = ["CutCat contributors"]
edition = "2021"

[lib]
name = "cutcat_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-shell = "2.3.5"
uuid = { version = "1", features = ["v4"] }
